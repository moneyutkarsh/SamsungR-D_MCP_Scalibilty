version: "3.9"

services:
  echo_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/echo.Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent_host:
    build:
      context: .
      dockerfile: infrastructure/docker/agent.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ECHO_TOOL_URL=http://echo_tool:8001
    depends_on:
      echo_tool:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

version: "3.9"

services:

  # -----------------------------
  # MCP Echo Tool Server
  # -----------------------------
  echo_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/echo.Dockerfile
    container_name: echo_tool
    ports:
      - "8001:8001"
    volumes:
      - ./data/logs:/data/logs
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8001"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Ollama Local LLM Server
  # -----------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # Optional: GPU support (uncomment if you have NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # -----------------------------
  # Agent Host (Orchestrator)
  # -----------------------------
  agent_host:
    build:
      context: .
      dockerfile: infrastructure/docker/agent.Dockerfile
    container_name: agent_host
    ports:
      - "8000:8000"
    environment:
      - ECHO_TOOL_URL=http://echo_tool:8001
      - ENVIRONMENT=docker

      # 🔥 Model selection
      - MODEL_BACKEND=ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b

    volumes:
      - ./data/logs:/data/logs

    depends_on:
      echo_tool:
        condition: service_healthy
      ollama:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # -----------------------------
  # Prometheus
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # -----------------------------
  # Grafana
  # -----------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

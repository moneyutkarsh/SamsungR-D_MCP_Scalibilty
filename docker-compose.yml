services:

  # -----------------------------
  # MCP Echo Tool Server
  # -----------------------------
  echo_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/echo.Dockerfile
    container_name: echo_tool
    ports:
      - "8001:8001"
    volumes:
      - ./data/logs:/data/logs
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8001"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # New Tool Servers
  # -----------------------------
  math_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/tool.Dockerfile
    container_name: math_tool
    ports:
      - "8002:8002"
    volumes:
      - ./data/logs:/data/logs
    command: ["python", "-m", "servers.math_tool.server"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8002"]
      interval: 10s
      timeout: 5s
      retries: 5

  search_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/tool.Dockerfile
    container_name: search_tool
    ports:
      - "8003:8003"
    volumes:
      - ./data/logs:/data/logs
    command: ["python", "-m", "servers.search_tool.server"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8003"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/tool.Dockerfile
    container_name: db_tool
    ports:
      - "8004:8004"
    volumes:
      - ./data/logs:/data/logs
      - ./data/tool_db.sqlite:/app/data/tool_db.sqlite
    command: ["python", "-m", "servers.db_tool.server"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8004"]
      interval: 10s
      timeout: 5s
      retries: 5

  file_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/tool.Dockerfile
    container_name: file_tool
    ports:
      - "8005:8005"
    volumes:
      - ./data/logs:/data/logs
      - ./data/tool_files:/app/data/tool_files
    command: ["python", "-m", "servers.file_tool.server"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8005"]
      interval: 10s
      timeout: 5s
      retries: 5

  sleep_tool:
    build:
      context: .
      dockerfile: infrastructure/docker/tool.Dockerfile
    container_name: sleep_tool
    ports:
      - "8006:8006"
    volumes:
      - ./data/logs:/data/logs
    command: ["python", "-m", "servers.sleep_tool.server"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8006"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Ollama Local LLM Server
  # -----------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # Optional: GPU support (uncomment if you have NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # -----------------------------
  # Agent Host (Orchestrator)
  # -----------------------------
  agent_host:
    build:
      context: .
      dockerfile: infrastructure/docker/agent.Dockerfile
    container_name: agent_host
    ports:
      - "8000:8000"
    environment:
      - ECHO_TOOL_URL=http://echo_tool:8001
      - MATH_TOOL_URL=http://math_tool:8002
      - SEARCH_TOOL_URL=http://search_tool:8003
      - DB_TOOL_URL=http://db_tool:8004
      - FILE_TOOL_URL=http://file_tool:8005
      - SLEEP_TOOL_URL=http://sleep_tool:8006
      - ENVIRONMENT=docker

      # 🔥 Model selection
      - MODEL_BACKEND=${MODEL_BACKEND:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}

    volumes:
      - ./data/logs:/data/logs

    depends_on:
      echo_tool:
        condition: service_healthy
      math_tool:
        condition: service_healthy
      search_tool:
        condition: service_healthy
      db_tool:
        condition: service_healthy
      file_tool:
        condition: service_healthy
      sleep_tool:
        condition: service_healthy
      ollama:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # -----------------------------
  # Prometheus
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # -----------------------------
  # Grafana
  # -----------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/mcp-scalability.json
    depends_on:
      - prometheus

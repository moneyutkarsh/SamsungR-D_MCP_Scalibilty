global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "agent_host"
    static_configs:
      - targets: ["agent_host:8000"]

  - job_name: "echo_tool"
    static_configs:
      - targets: ["echo_tool:8001"]

  - job_name: "math_tool"
    static_configs:
      - targets: ["math_tool:8002"]

  - job_name: "search_tool"
    static_configs:
      - targets: ["search_tool:8003"]

  - job_name: "db_tool"
    static_configs:
      - targets: ["db_tool:8004"]

  - job_name: "file_tool"
    static_configs:
      - targets: ["file_tool:8005"]

  - job_name: "sleep_tool"
    static_configs:
      - targets: ["sleep_tool:8006"]
